<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نصائح سريعة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
--primary:#16a34a;
--dark:#0f172a;
--muted:#64748b;
--glass:rgba(255,255,255,.78);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Cairo',sans-serif;
min-height:100vh;
padding:18px;
color:var(--dark);
background:
radial-gradient(circle at top right,rgba(34,197,94,.22),transparent 35%),
radial-gradient(circle at bottom left,rgba(20,184,166,.16),transparent 35%),
linear-gradient(180deg,#f8fafc,#ecfdf5);
}

.page{
max-width:760px;
margin:auto;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
}

.brand{
display:flex;
align-items:center;
gap:10px;
font-weight:800;
font-size:20px;
}

.brand img{
width:50px;
height:50px;
border-radius:14px;
}

.back-small{
width:42px;
height:42px;
border-radius:50%;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
color:var(--dark);
box-shadow:0 8px 18px rgba(0,0,0,.08);
}

.hero{
background:var(--glass);
backdrop-filter:blur(12px);
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 15px 30px rgba(0,0,0,.08);
}

.badge{
display:inline-flex;
align-items:center;
gap:6px;
background:#dcfce7;
color:#15803d;
padding:6px 12px;
border-radius:999px;
font-size:12px;
font-weight:800;
margin-bottom:12px;
}

.hero h1{
font-size:28px;
margin-bottom:6px;
}

.hero p{
color:var(--muted);
font-size:14px;
line-height:1.7;
}

.tip-card{
background:linear-gradient(135deg,#16a34a,#22c55e);
color:white;
border-radius:28px;
padding:28px;
min-height:260px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
box-shadow:0 18px 40px rgba(22,163,74,.22);
margin-bottom:16px;
}

.tip-icon{
width:70px;
height:70px;
border-radius:50%;
background:rgba(255,255,255,.2);
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
margin-bottom:16px;
}

.tip-card h2{
font-size:30px;
margin-bottom:10px;
}

.tip-card p{
font-size:15px;
line-height:1.8;
opacity:.95;
}

.next-btn{
width:100%;
padding:15px;
border:none;
border-radius:18px;
background:var(--dark);
color:white;
font-family:'Cairo',sans-serif;
font-size:16px;
font-weight:800;
cursor:pointer;
transition:.25s;
margin-bottom:12px;
}

.next-btn:hover{
transform:translateY(-3px);
box-shadow:0 12px 25px rgba(15,23,42,.18);
}

.small-note{
background:var(--glass);
backdrop-filter:blur(10px);
border-radius:18px;
padding:14px;
font-size:13px;
color:var(--muted);
line-height:1.7;
margin-bottom:14px;
}

.back{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
padding:14px;
background:#e2e8f0;
color:#0f172a;
border-radius:18px;
text-decoration:none;
font-weight:800;
}

@media(max-width:600px){
.hero h1{
font-size:24px;
}

.tip-card{
min-height:230px;
padding:24px;
}

.tip-card h2{
font-size:25px;
}
}
</style>
</head>

<body>

<div class="page">

<div class="top">
<div class="brand">
<img src="meras.jpeg" alt="شعار ممشى الحياة">
<span>ممشى الحياة</span>
</div>

<a href="path.html" class="back-small">
<i class="fas fa-arrow-right"></i>
</a>
</div>

<section class="hero">
<div class="badge">
<i class="fas fa-bolt"></i>
نصائح سريعة
</div>

</section>

<section class="tip-card">
<div class="tip-icon" id="tipIcon">
<i class="fas fa-bottle-water"></i>
</div>

<h2 id="tipTitle">اشرب ماء</h2>
<p id="tipText">خذ رشفة ماء الآن، حتى لو لم تشعر بالعطش.</p>
</section>

<button class="next-btn" onclick="showRandomTip()">
<i class="fas fa-shuffle"></i>
اعرض نصيحة أخرى
</button>

<div class="small-note">
<i class="fas fa-circle-info"></i>
النصائح قصيرة حتى تكون مناسبة أثناء المشي بدون إطالة أو تشتيت.
</div>

<a href="path.html" class="back">
<i class="fas fa-arrow-right"></i>
العودة للمسار
</a>

</div>

<script>
const tips = [
{
title:"اشرب ماء",
text:"خذ رشفة ماء الآن، حتى لو لم تشعر بالعطش.",
icon:"fas fa-bottle-water"
},
{
title:"خفف السرعة",
text:"إذا شعرت بتعب أو ضيق نفس، خفف سرعتك ولا تضغط على نفسك.",
icon:"fas fa-gauge-simple"
},
{
title:"خذ نفس",
text:"تنفس بعمق من الأنف وأخرج الهواء بهدوء من الفم.",
icon:"fas fa-wind"
},
{
title:"ارفع رأسك",
text:"انظر للأمام وحافظ على وضعية مستقيمة أثناء المشي.",
icon:"fas fa-person-walking"
},
{
title:"حرّك كتفيك",
text:"أرخِ كتفيك ولا تشد جسمك أثناء الحركة.",
icon:"fas fa-arrows-rotate"
},
{
title:"راقب خطواتك",
text:"امشِ بخطوات ثابتة ومريحة بدل الخطوات السريعة جدًا.",
icon:"fas fa-shoe-prints"
},
{
title:"استمع لجسمك",
text:"إذا شعرت بدوخة أو ألم غير طبيعي، توقف وخذ راحة.",
icon:"fas fa-heart-pulse"
},
{
title:"ابتسم",
text:"المشي ليس تمرينًا فقط، هو وقت لطيف لنفسك.",
icon:"fas fa-face-smile"
}
];

function showRandomTip(){
let randomIndex = Math.floor(Math.random() * tips.length);
let tip = tips[randomIndex];

document.getElementById("tipTitle").innerText = tip.title;
document.getElementById("tipText").innerText = tip.text;
document.getElementById("tipIcon").innerHTML = "<i class='" + tip.icon + "'></i>";
}
</script>

</body>
</html>
