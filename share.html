<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شارك تجربتك</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
--primary:#16a34a;
--dark:#0f172a;
--muted:#64748b;
--glass:rgba(255,255,255,.78);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Cairo',sans-serif;
min-height:100vh;
padding:18px;
color:var(--dark);
background:
radial-gradient(circle at top right,rgba(34,197,94,.22),transparent 35%),
linear-gradient(180deg,#f8fafc,#ecfdf5);
}

.page{max-width:760px;margin:auto;}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
}

.brand{
display:flex;
align-items:center;
gap:10px;
font-weight:800;
font-size:20px;
}

.brand img{
width:50px;
height:50px;
border-radius:14px;
}

.back-small{
width:42px;
height:42px;
border-radius:50%;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
color:var(--dark);
box-shadow:0 8px 18px rgba(0,0,0,.08);
}

.hero{
background:var(--glass);
backdrop-filter:blur(12px);
border-radius:26px;
padding:22px;
margin-bottom:16px;
box-shadow:0 15px 30px rgba(0,0,0,.08);
text-align:center;
}

.hero h1{
font-size:28px;
margin-bottom:6px;
}

.hero p{
color:var(--muted);
font-size:14px;
}

/* HASHTAG */
.hashtag{
background:linear-gradient(135deg,#16a34a,#22c55e);
color:white;
border-radius:24px;
padding:24px;
text-align:center;
font-size:22px;
font-weight:800;
margin-bottom:14px;
box-shadow:0 18px 40px rgba(22,163,74,.25);
}

/* BUTTONS */
.btn{
width:100%;
padding:15px;
border:none;
border-radius:18px;
font-family:'Cairo',sans-serif;
font-size:16px;
font-weight:800;
cursor:pointer;
margin-bottom:10px;
transition:.25s;
display:flex;
justify-content:center;
align-items:center;
gap:8px;
text-decoration:none;
}

.share{
background:var(--primary);
color:white;
}

.survey{
background:#0f172a;
color:white;
}

.btn:hover{
transform:translateY(-3px);
}

/* NOTE */
.note{
background:var(--glass);
border-radius:18px;
padding:14px;
font-size:13px;
color:var(--muted);
text-align:center;
margin-top:10px;
}

.back{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
margin-top:16px;
padding:14px;
background:#e2e8f0;
border-radius:18px;
text-decoration:none;
color:#0f172a;
font-weight:800;
}
</style>
</head>

<body>

<div class="page">

<div class="top">
<div class="brand">
<img src="meras.jpeg">
<span>ممشى الحياة</span>
</div>

<a href="path.html" class="back-small">
<i class="fas fa-arrow-right"></i>
</a>
</div>

<section class="hero">
<h1>شارك تجربتك</h1>
<p>انشر تجربتك وساعد غيرك يبدأ رحلته الصحية</p>
</section>

<div class="hashtag">
#ممشى_الحياة
</div>

<button class="btn share" onclick="shareExperience()">
<i class="fas fa-share-nodes"></i>
مشاركة التجربة
</button>

<a href="https://your-form-link.com" class="btn survey" target="_blank">
<i class="fas fa-clipboard"></i>
تعبئة الاستبيان
</a>

<div class="note">
مشاركتك تفرق 🌱 وتساعدنا نحسّن التجربة للجميع
</div>

<a href="path.html" class="back">
<i class="fas fa-arrow-right"></i>
العودة للمسار
</a>

</div>

<script>
function shareExperience(){
if(navigator.share){
navigator.share({
title:"ممشى الحياة",
text:"شاركت تجربتي في ممشى الحياة 🚶‍♀️✨",
url:window.location.href
});
}else{
alert("يمكنك نسخ الرابط ومشاركته يدويًا");
}
}
</script>

</body>
</html>
